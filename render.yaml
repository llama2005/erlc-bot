# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push to GitHub → Render → New → Blueprint → pick the repo.
# Database: create a free Postgres at neon.tech and paste its URL as DATABASE_URL
# on BOTH services (Render → each service → Environment).

services:
  # --- the Discord bot (no inbound HTTP) ---
  - type: worker
    name: erlc-bot
    runtime: node
    plan: starter # workers need a paid plan; Starter gets static outbound IPs
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: node src/start.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: DASHBOARD_URL
        sync: false # same value as the dashboard service's DASHBOARD_URL below — the bot needs it too for /dashboard, /website, /about, /setup, /support
      # --- recommended / optional (add in the Render dashboard, all safe to leave unset) ---
      # - key: SENTRY_DSN        # error reporting + the in-Discord "Report a problem" button
      # - key: BLOXLINK_API_KEY  # resolve accounts linked via Bloxlink, not just our /verify
      # - key: ERLC_GLOBAL_KEY   # PRC global API key (approved apps) — raises rate limits
      # - key: SHARDING          # set to 1 only past ~2000 guilds
      #
      # NODE_ENV=production disables the shared ERLC_KEY fallback and forces global slash
      # registration. Do not add ERLC_KEY / DEV_GUILD_ID here — they're dev-instance only.
      # Allowlist ALL of this service's Outbound IP Addresses (Settings tab) at
      # https://api.erlc.gg/server-owners or in-game :commands will fail.

  # --- the web dashboard ---
  - type: web
    name: erlc-bot-dashboard
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: node web/server.js
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DASHBOARD_URL
        sync: false # set to the dashboard's own https URL once Render assigns it
      # - key: SENTRY_DSN  # optional — same DSN as the worker
